[licenses]
confidence-threshold = 0.8
unused-allowed-license = "deny"
unused-license-exception = "deny"

# Permissive licence expressions currently present in the resolved graph.
# Licences not listed here or in a crate-specific exception are denied.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# First-party source; dependencies must satisfy the allowlist above.
exceptions = [
    # egui bundled fonts, unchanged; notices included in crates/systemless-ui/licenses.
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
    { crate = "systemless-ui", allow = ["GPL-3.0-or-later"] },
]
