[licenses]
confidence-threshold = 0.8
unused-allowed-license = "deny"
unused-license-exception = "deny"
# Reviewed permissive licenses for the independent rebuild dependency graph.
# The local runtime alone receives a GPL exception.
allow = [
    "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "MIT", "Unicode-3.0", "Unlicense", "Zlib",
]
exceptions = [
    { crate = "systemless-future", allow = ["GPL-3.0-or-later"] },
]
