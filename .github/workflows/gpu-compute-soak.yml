name: GPU compute resource qualification

on:
  pull_request:
    paths:
      - 'src/bin/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/scripts/soak-gpu-compute.py'
      - '.github/scripts/test-soak-gpu-compute.py'
      - '.github/workflows/gpu-compute-soak.yml'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Active session seconds per OS (1..18000; default two hours)'
        required: false
        default: '7200'
      workload:
        description: 'CPU baseline diagnoses allocations; it never qualifies GPU work'
        type: choice
        options: [gpu, cpu-baseline]
        default: gpu
      profile:
        description: 'Build profile; compare separately, PR checks retain runtime validation'
        type: choice
        options: [ci-test, release]
        default: ci-test
      os:
        description: 'Select one OS for a diagnostic rerun; PR checks retain all three'
        type: choice
        options: [all, ubuntu-latest, macos-latest, windows-latest]
        default: all

permissions:
  contents: read

concurrency:
  group: gpu-compute-soak-${{ github.ref }}-${{ inputs.os || 'all' }}-${{ inputs.profile || 'ci-test' }}-${{ inputs.workload || 'gpu' }}
  cancel-in-progress: true

jobs:
  compute:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.os != 'all' && format('["{0}"]', inputs.os) || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      COMPUTE_SOAK_WORKLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.workload || 'gpu' }}
      COMPUTE_SOAK_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'ci-test' }}
      COMPUTE_SOAK_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.seconds || '1' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate duration and report parser
        run: |
          python -c 'import os; n=int(os.environ["COMPUTE_SOAK_SECONDS"]); assert 1 <= n <= 18000, "seconds must be 1..18000 in hosted jobs"'
          python .github/scripts/test-soak-gpu-compute.py
      - name: Install Linux audio and GPU dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libvulkan1 mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Qualify active guest GPU resources
        run: python .github/scripts/soak-gpu-compute.py --seconds "$COMPUTE_SOAK_SECONDS" --profile "$COMPUTE_SOAK_PROFILE" --workload "$COMPUTE_SOAK_WORKLOAD" --output compute-resource-results
      - name: Verify QD3D GPU pixel oracles
        if: env.COMPUTE_SOAK_WORKLOAD == 'gpu'
        env:
          SYSTEMLESS_REQUIRE_GPU: '1'
        run: cargo test --locked --profile "$COMPUTE_SOAK_PROFILE" --features test-support --bin systemless wgpu_qd3d::tests::gpu_ -- --test-threads=1
      - name: Verify guest thread CPU accounting
        if: env.COMPUTE_SOAK_WORKLOAD == 'gpu'
        env:
          SYSTEMLESS_BENCH_THREAD_CPU: '1'
          SYSTEMLESS_BENCH_GUEST_CASE: text
          SYSTEMLESS_BENCH_SAMPLES: '3'
        run: cargo test --locked --profile "$COMPUTE_SOAK_PROFILE" --features test-support --bin systemless renderer_bench::benchmark_guest_renderers -- --exact --ignored --nocapture --test-threads=1 2>&1 | tee compute-resource-results/thread-cpu-smoke.log
      - name: Preserve compute evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpu-compute-${{ matrix.os }}
          path: compute-resource-results/
          if-no-files-found: warn
