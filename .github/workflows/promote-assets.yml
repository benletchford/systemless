name: Promote catalogue assets

on:
  workflow_dispatch:
    inputs:
      entry:
        description: Comma-separated stable entry IDs to promote
        required: true
        type: string
      pull_request:
        description: Open pull request containing the title submission
        required: true
        type: string
      source_commit:
        description: Full commit SHA of the reviewed catalogue submission in this repository
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: catalogue-asset-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENTRY_INPUT: ${{ inputs.entry }}
      PULL_REQUEST: ${{ inputs.pull_request }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build trusted CLI
        run: cargo +stable build --locked -p systemless-catalogue-tools --bin catalogue
      - name: Require an immutable submission reference
        shell: bash
        run: |
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::source_commit must be a full lowercase commit SHA'
            exit 1
          fi
      - name: Require the reviewed head of an open PR
        id: submission
        uses: actions/github-script@v7
        with:
          script: |
            if (!/^[1-9][0-9]*$/.test(process.env.PULL_REQUEST)) {
              throw new Error('pull_request must be a positive PR number');
            }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.PULL_REQUEST)
            });
            if (pr.state !== 'open' || pr.base.ref !== context.payload.repository.default_branch ||
                pr.head.sha !== process.env.SOURCE_COMMIT || !pr.head.repo) {
              throw new Error('Submission must match the current head of an open PR targeting the default branch');
            }
            core.setOutput('repository', pr.head.repo.full_name);
      - name: Check out submission data
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.submission.outputs.repository }}
          ref: ${{ inputs.source_commit }}
          path: submission
          persist-credentials: false
      - name: Normalize selected entries
        shell: bash
        run: |
          set -euo pipefail
          input="$ENTRY_INPUT"
          if [[ -z "${input//[[:space:]]/}" ]]; then
            echo '::error::entry must contain one or more nonempty comma-separated stable IDs'
            exit 1
          fi
          : > selected-entry-ids.txt
          declare -A seen=()
          last_entry=false
          while [[ "$last_entry" == false ]]; do
            if [[ "$input" == *,* ]]; then
              raw_entry="${input%%,*}"
              input="${input#*,}"
            else
              raw_entry="$input"
              last_entry=true
            fi
            entry="$raw_entry"
            entry="${entry#"${entry%%[![:space:]]*}"}"
            entry="${entry%"${entry##*[![:space:]]}"}"
            if [[ -z "$entry" ]]; then
              echo '::error::entry must contain one or more nonempty comma-separated stable IDs'
              exit 1
            fi
            if [[ ! "$entry" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              echo "::error::unsafe entry ID: $entry"
              exit 1
            fi
            if [[ -n "${seen[$entry]+present}" ]]; then
              echo "::error::duplicate entry ID: $entry"
              exit 1
            fi
            seen["$entry"]=present
            printf '%s\n' "$entry" >> selected-entry-ids.txt
          done
      - name: Validate and inspect selected sources without credentials
        shell: bash
        run: |
          ./target/debug/catalogue --root submission/www check
          while IFS= read -r entry; do
            ./target/debug/catalogue --root submission/www assets promote \
              --entry "$entry" > "promotion-preview-$entry.json"
          done < selected-entry-ids.txt
      - name: Promote selected assets to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          while IFS= read -r entry; do
            ./target/debug/catalogue --root submission/www assets promote \
              --entry "$entry" --apply > "promotion-result-$entry.json"
          done < selected-entry-ids.txt
      - name: Validate and compile promoted catalogue
        shell: bash
        run: |
          ./target/debug/catalogue --root submission/www check --no-incoming
          ./target/debug/catalogue --root submission/www build
      - name: Save source rewrites and recovery journal
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: promoted-catalogue-${{ github.run_id }}
          retention-days: 14
          include-hidden-files: true
          path: |
            submission/www/catalogue/
            selected-entry-ids.txt
            promotion-preview-*.json
            promotion-result-*.json
            submission/www/catalogue/.promotion/transaction.json
