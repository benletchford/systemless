name: Configure popularity rate limit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: popularity-rate-limit-production
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test rate limit configuration
        run: node --test www/tests/popularity-rate-limit.test.cjs
      - name: Configure and verify the Cloudflare rule
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node www/scripts/configure-popularity-rate-limit.cjs
