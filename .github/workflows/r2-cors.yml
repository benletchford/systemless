name: R2 public read CORS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-public-read-cors
  cancel-in-progress: false

jobs:
  apply:
    # Run only trusted code from the default branch with production secrets.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate public read policy
        run: |
          jq -e '.rules | length == 1' www/r2-cors.json
          jq -e '.rules[0].allowed.origins == ["*"] and .rules[0].allowed.methods == ["GET", "HEAD"]' www/r2-cors.json
      - name: Apply and display R2 CORS policy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.142.0
          command: r2 bucket cors set ${{ secrets.R2_BUCKET }} --file www/r2-cors.json --force
          postCommands: r2 bucket cors list ${{ secrets.R2_BUCKET }}
