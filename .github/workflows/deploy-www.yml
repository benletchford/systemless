name: Deploy website

on:
  workflow_call:
    inputs:
      tag:
        description: Release-please tag whose commit will be deployed
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-www-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Validate catalogue
        run: cargo run --locked -p systemless-catalogue-tools -- --root www check --production
      - name: Build production pages
        env:
          SYSTEMLESS_CATALOGUE_PRODUCTION: 1
        run: ./www/scripts/build-pages.sh
      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy www/dist --project-name=systemless-org --branch=master
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
