name: Deploy website

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag or commit to deploy
        required: true
        type: string
      inspect_only:
        description: Read popularity counts without deploying
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        description: Release-please tag whose commit will be deployed
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-www-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !inputs.inspect_only }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure popularity database
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_POPULARITY_DATABASE_ID: ${{ vars.CLOUDFLARE_POPULARITY_DATABASE_ID }}
        run: node www/scripts/configure-popularity.cjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Validate catalogue
        run: cargo run --locked -p systemless-catalogue-tools -- --root www check --production
      - name: Build production pages
        env:
          SYSTEMLESS_CATALOGUE_PRODUCTION: 1
        run: ./www/scripts/build-pages.sh
      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: www
          wranglerVersion: 4.142.0
          command: |
            d1 migrations apply POPULARITY --remote
            pages deploy dist --project-name=systemless-org --branch=master
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  inspect:
    if: ${{ inputs.inspect_only }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read production popularity aggregates
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_POPULARITY_DATABASE_ID: ${{ vars.CLOUDFLARE_POPULARITY_DATABASE_ID }}
        run: node .github/scripts/inspect-popularity.cjs
