name: R2 connection check

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Update archive download names and delete orphaned managed objects'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: r2-connection-check
  cancel-in-progress: false

jobs:
  inventory:
    # Credentials are available only to explicitly dispatched default-branch code.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build trusted CLI without R2 credentials
        run: cargo +stable build --locked --release -p systemless-catalogue-tools --bin catalogue
      - name: Check managed R2 objects
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          for name in R2_ACCOUNT_ID R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          ./target/release/catalogue --root www check --production
          if [[ '${{ inputs.apply }}' == 'true' ]]; then
            ./target/release/catalogue --root www r2 sync-download-names --apply
          fi
          ./target/release/catalogue --root www r2 inventory --output "$RUNNER_TEMP/r2-inventory.json"
          ./target/release/catalogue --root www r2 plan \
            --inventory "$RUNNER_TEMP/r2-inventory.json" \
            --output "$RUNNER_TEMP/r2-plan.json" \
            --max-delete 100000 --max-delete-percent 100 --min-age-hours 24
          if [[ '${{ inputs.apply }}' == 'true' ]]; then
            ./target/release/catalogue --root www r2 reconcile --plan "$RUNNER_TEMP/r2-plan.json" --apply
            ./target/release/catalogue --root www r2 inventory --output "$RUNNER_TEMP/r2-after.json"
          fi
      - name: Save R2 audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r2-audit-${{ github.run_id }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/r2-inventory.json
            ${{ runner.temp }}/r2-plan.json
            ${{ runner.temp }}/r2-after.json
      - name: Summarize R2 audit
        shell: bash
        run: |
          count=$(jq '.objects | length' "$RUNNER_TEMP/r2-inventory.json")
          orphaned=$(jq '.delete | length' "$RUNNER_TEMP/r2-plan.json")
          named=$(jq '[.desired[] | select(.download_name != null)] | length' "$RUNNER_TEMP/r2-plan.json")
          {
            echo '### Managed R2 catalogue audit'
            echo
            echo "Managed objects before reconciliation: $count"
            echo "Referenced archives with download names: $named"
            echo "Orphaned managed objects eligible for deletion: $orphaned"
            echo "Apply requested: ${{ inputs.apply }}"
            echo 'The attached audit contains the complete inventory and deletion plan.'
          } >> "$GITHUB_STEP_SUMMARY"
