name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.93"
          command: check licenses

  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Keep routine CI on Linux; release-please squash commits get the full
        # cross-platform matrix.
        os: >-
          ${{ fromJSON(
            github.event_name == 'push' &&
            startsWith(github.event.head_commit.message, 'chore(master): release ') &&
            '["ubuntu-latest","macos-latest","windows-latest"]' ||
            '["ubuntu-latest"]'
          ) }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Compile everything (lib + the GUI binary, all features) on each OS so
      # platform-specific breakage in winit/softbuffer/cpal is caught early.
      - name: Build all targets
        run: cargo build --all-targets --all-features

      # test-support enables the scripted_traces module and its tests.
      - name: Run library tests
        run: cargo test --lib --features test-support

      - name: Run desktop tests
        run: cargo test --locked --bin systemless

      - name: Run toolbox showcase integration test (68k)
        run: cargo test --test toolbox_showcase

      - name: Run toolbox showcase integration test (PowerPC)
        env:
          SYSTEMLESS_PREFER_POWERPC: 1
        run: cargo test --test toolbox_showcase

      - name: Run toolbox showcase integration test (Systemless theme)
        env:
          SYSTEMLESS_TOOLBOX_THEME: systemless-default
        run: cargo test --locked --test toolbox_showcase

  checks:
    name: headless & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify reproducible toolbox showcase archive
        run: ./tests/toolbox-showcase/build.sh --verify

      - name: Verify toolbox native capture identities and coverage
        run: python3 -B tests/toolbox-showcase/oracle/verify_coverage.py

      - name: Headless library build (no default features)
        run: cargo check --no-default-features

      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::private_intra_doc_links
        run: cargo doc --all-features --locked --no-deps --document-private-items

      - name: Verify the public binary list
        run: |
          cargo metadata --locked --no-deps --format-version 1 > metadata.json
          python3 - <<'PYTHON'
          import json
          with open("metadata.json") as source:
              metadata = json.load(source)
          crate = next(p for p in metadata["packages"] if p["name"] == "systemless")
          binaries = [t["name"] for t in crate["targets"] if "bin" in t["kind"]]
          assert binaries == ["systemless"], binaries
          PYTHON
          rm metadata.json

      # Catch packaging/metadata problems before a release ever runs.
      - name: Package and verify crate
        run: cargo package --locked

      - name: Check crates.io upload size
        run: |
          python3 - <<'PYTHON'
          import pathlib, tomllib
          with open("Cargo.toml", "rb") as manifest:
              package = tomllib.load(manifest)["package"]
          archive = pathlib.Path("target/package") / f"{package['name']}-{package['version']}.crate"
          size = archive.stat().st_size
          limit = 10 * 1024 * 1024
          print(f"Crate upload: {size:,} bytes (limit {limit:,})")
          assert size <= limit, "Crate exceeds the crates.io upload limit"
          PYTHON

  lint:
    name: fmt & clippy (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Non-blocking for now: the tree is not yet rustfmt-clean and clippy
      # reports pre-existing warnings. Drop `continue-on-error` on each step
      # (and add `-D warnings` to clippy) once a formatting/clippy pass lands.
      - name: rustfmt
        continue-on-error: true
        run: cargo fmt --check

      - name: clippy
        continue-on-error: true
        run: cargo clippy --all-targets --all-features
