name: Native window qualification

on:
  pull_request:
    paths:
      - 'src/bin/**'
      - 'crates/systemless-ui/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/native-window.yml'
      - '.github/scripts/verify-native-window.py'
      - '.github/scripts/wait-for-window-manager.py'
      - '.github/scripts/test-native-window-cases.py'
  workflow_dispatch:
    inputs:
      soak-seconds:
        description: 'Lifecycle soak seconds per renderer/runtime (0 skips)'
        required: false
        default: '0'
      runtime:
        description: 'Runtime for a long single-session soak'
        type: choice
        options: [all, inline, thread]
        default: all
      presenter:
        description: 'Presenter for a long single-session soak'
        type: choice
        options: [all, platform, wgpu, software]
        default: all

permissions:
  contents: read

concurrency:
  group: native-window-${{ github.ref }}-${{ inputs.runtime || 'all' }}-${{ inputs.presenter || 'all' }}
  cancel-in-progress: true

jobs:
  window:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SOAK_RUNTIME: ${{ inputs.runtime || 'all' }}
      SOAK_PRESENTER: ${{ inputs.presenter || 'all' }}
    # Unfiltered cases allow one hour each; a selected owner can run up to five.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - name: Install virtual desktop
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config xvfb openbox x11-apps x11-utils imagemagick libxkbcommon-x11-0 libvulkan1 mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate lifecycle case selection
        env:
          SOAK_SECONDS: ${{ inputs.soak-seconds || '30' }}
        run: |
          python3 -c 'import os; n=int(os.environ["SOAK_SECONDS"]); assert 0 <= n <= 18000, "hosted soak seconds must be 0..18000"'
          python3 .github/scripts/test-native-window-cases.py
          python3 .github/scripts/verify-native-window.py --soak-only --soak-seconds "$SOAK_SECONDS" --runtime "$SOAK_RUNTIME" --presenter "$SOAK_PRESENTER" --dry-run
      - name: Verify streamed native diagnostics
        run: cargo test --locked --profile ci-test --bin systemless --features test-support native_window_probe::tests -- --test-threads=1
      - name: Verify GPU resource observations
        env:
          SYSTEMLESS_REQUIRE_GPU: "1"
        run: cargo test --locked --profile ci-test --bin systemless --features test-support gpu_resources::tests -- --test-threads=1
      - name: Build optimized native probe
        run: cargo build --locked --profile ci-test --bin systemless --features test-support
      - name: Run Linux native window checks
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1200x24' sh -c 'openbox & python3 .github/scripts/wait-for-window-manager.py && python3 .github/scripts/verify-native-window.py'
      - name: Run macOS native window checks
        if: runner.os == 'macOS'
        run: python3 .github/scripts/verify-native-window.py
      - name: Run Linux lifecycle soak
        if: runner.os == 'Linux' && (github.event_name != 'workflow_dispatch' || inputs.soak-seconds != '0')
        env:
          SOAK_SECONDS: ${{ inputs.soak-seconds || '30' }}
        run: xvfb-run -a -s '-screen 0 1600x1200x24' sh -c 'openbox & python3 .github/scripts/wait-for-window-manager.py && python3 .github/scripts/verify-native-window.py --soak-only --soak-seconds "$SOAK_SECONDS" --runtime "$SOAK_RUNTIME" --presenter "$SOAK_PRESENTER" --output native-window-results/soak'
      - name: Run macOS lifecycle soak
        if: runner.os == 'macOS' && (github.event_name != 'workflow_dispatch' || inputs.soak-seconds != '0')
        env:
          SOAK_SECONDS: ${{ inputs.soak-seconds || '30' }}
        run: python3 .github/scripts/verify-native-window.py --soak-only --soak-seconds "$SOAK_SECONDS" --runtime "$SOAK_RUNTIME" --presenter "$SOAK_PRESENTER" --output native-window-results/soak
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-window-${{ matrix.os }}
          path: native-window-results/
          if-no-files-found: warn
