name: Native window qualification

on:
  pull_request:
    paths:
      - 'src/bin/**'
      - '.github/workflows/native-window.yml'
      - '.github/scripts/verify-native-window.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-window-${{ github.ref }}
  cancel-in-progress: true

jobs:
  window:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Install virtual desktop
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config xvfb openbox libxkbcommon-x11-0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build optimized native probe
        run: cargo build --locked --profile ci-test --bin systemless --features test-support
      - name: Run Linux native window checks
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1200x24' sh -c 'openbox & python3 .github/scripts/verify-native-window.py'
      - name: Run macOS native window checks
        if: runner.os == 'macOS'
        run: python3 .github/scripts/verify-native-window.py
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-window-${{ matrix.os }}
          path: native-window-results/
          if-no-files-found: warn
