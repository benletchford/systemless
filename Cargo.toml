[package]
name = "systemless"
version = "0.44.0"
edition = "2021"
rust-version = "1.93"
# Emulator code is GPL-3.0-or-later.
# Bundled URW, Noto and Coppet font assets are under OFL-1.1.
license = "GPL-3.0-or-later AND OFL-1.1"
description = "High-Level Emulation for classic Macintosh applications"
readme = "README.md"
keywords = ["macintosh", "emulator", "68k", "hle", "quickdraw"]
categories = ["emulators", "rendering", "game-development"]
repository = "https://github.com/benletchford/systemless"
documentation = "https://docs.rs/systemless"
# `cargo run` (no `--bin`) routes to the GUI runner for local checkouts.
default-run = "systemless"
autobins = false

# Ship runtime sources and documentation, not the repository's visual oracle
# suite. The native PCM fixtures are embedded by library unit tests.
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/src/**",
    "/*.md",
    "/LICENSE",
    "/.github/assets/**",
    "/tests/toolbox-showcase/reference/native-audio/*.u8",
]

[workspace]
members = ["www/tools/catalogue", "www"]
exclude = ["tests/toolbox-showcase/packer"]
default-members = ["."]
resolver = "2"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
m68k = { version = "0.14.0" }
ppc = "0.6.3"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25.1"
skrifa = "0.43.2"
zeno = "0.3.3"

# Windowing (optional, for graphical runner)
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }
cpal = { version = "0.15", optional = true }
stuffit = "0.1.5"
hfsplus = "0.2.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

# Pure-Rust math library for cross-platform deterministic transcendentals
libm = "0.2"

[features]
default = ["gui", "jit"]
gui = [
    "winit",
    "softbuffer",
    "cpal",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
    "dep:objc2-metal",
    "dep:objc2-quartz-core",
    "dep:windows",
]
# Compile hot 68K traces to native code. Embeddings constrained by executable-
# memory policy can omit this feature and use m68k's portable trace executor.
jit = ["m68k/jit"]
# Exposes `scripted_traces`, deterministic trap-replay test scaffolding.
# Off by default so it stays out of the published public API and docs.
test-support = []
# Opt-in debugger and inspection API. Off by default so ordinary builds do
# not compile the control/inspection foundation or carry its runtime state.
debug = []
# Debugger socket transport (Unix-domain sockets). Implies `debug`.
debug-server = ["debug"]

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.54", optional = true, features = [
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading", "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.5.2", optional = true }
objc2-app-kit = { version = "0.2.2", optional = true, features = ["NSApplication", "NSBitmapImageRep", "NSCursor", "NSCell", "NSGraphics", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.2.2", optional = true, features = ["NSGeometry", "NSObject", "NSProcessInfo", "NSString"] }
objc2-metal = { version = "0.2.2", optional = true, features = [
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLDrawable",
    "MTLLibrary",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
] }
objc2-quartz-core = { version = "0.2.2", optional = true, features = [
    "CATransaction",
    "CALayer",
    "CAMetalLayer",
    "objc2-metal",
] }

[[bin]]
name = "systemless"
required-features = ["gui"]

[dev-dependencies]
hfsplus = { version = "0.2.4", features = ["testutil"] }
tempfile = "3"

# The 68k interpreter is the dominant hot path; fat LTO + a single
# codegen unit let the optimizer inline across crates, which is worth
# the longer build time.
[profile.release]
lto = "fat"
codegen-units = 1

# Optimized builds for performance iteration, where `release`'s whole-program
# LTO in a single codegen unit costs minutes per rebuild. Thin LTO keeps the
# cross-crate inlining that matters here — the hot paths call through
# `PpcMemory`/`AddressBus` into the `ppc` and `m68k` crates.io crates, so
# disabling LTO outright would change the very code being measured — while
# parallel codegen units and incremental reuse make rebuilds practical.
#
# Timings differ from `release`; use it to A/B your own changes, and confirm
# final numbers on `release`.
[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true

# Execute emulator-heavy integration tests efficiently without production LTO
# costs or dropping the runtime checks exercised by ordinary debug tests.
[profile.ci-test]
inherits = "dev"
opt-level = 2
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true
incremental = false
