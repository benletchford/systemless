[licenses]
confidence-threshold = 0.8
unused-allowed-license = "deny"
# GPUI Kit is optional, so its reviewed exceptions are unused in the default
# graph. Keep unreviewed license expressions denied in either graph.
unused-license-exception = "warn"

# Permissive licence expressions currently present in the resolved graph.
# Licences not listed here or in a crate-specific exception are denied.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Keep copyleft and component-specific licences scoped to the reviewed crates
# that require them. New GPL, LGPL, AGPL, or OFL dependencies will fail.
exceptions = [
    { crate = "systemless", allow = ["GPL-3.0-or-later", "OFL-1.1"] },
    # Exact transitive crates in the GPUI Kit 0.7.1 all-features graph.
    { crate = "cbindgen", allow = ["MPL-2.0"] },
    { crate = "dwrote", allow = ["MPL-2.0"] },
    { crate = "option-ext", allow = ["MPL-2.0"] },
    { crate = "hexf-parse", allow = ["CC0-1.0"] },
    { crate = "notify", allow = ["CC0-1.0"] },
    { crate = "tiny-keccak", allow = ["CC0-1.0"] },
    { crate = "libbz2-rs-sys", allow = ["bzip2-1.0.6"] },
]
